name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build runGameTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-player-carts
          path: |
            build/libs/*.jar
            build/**/TEST-*.xml
            build/**/logs/latest.log
